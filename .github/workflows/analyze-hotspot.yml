name: Analyze Hotspot archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-hotspot.yml"
      - "tools/analyze_hotspot_archives.py"
      - "AL-TAJ.NET.rar.zip"
      - "Tecsmart.zip"
      - "صفحه رشيد اعتقد بدون اي تعديل.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotspot-archive-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract and inspect all Hotspot archives
        run: python3 tools/analyze_hotspot_archives.py

      - name: Upload extracted files and analysis
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-source-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish analysis report to repository
        run: |
          mkdir -p analysis
          cp analysis-output/HOTSPOT_ANALYSIS.md analysis/THIRD_PAGE_COMPARISON.md
          cp analysis-output/inventory.json analysis/THREE_PAGE_INVENTORY.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/THIRD_PAGE_COMPARISON.md analysis/THREE_PAGE_INVENTORY.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish three-page Hotspot comparison"
            git pull --rebase origin main
            git push
          fi
