name: Analyze Hotspot archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-hotspot.yml"
      - "tools/analyze_hotspot_archives.py"
      - "AL-TAJ.NET.rar.zip"
      - "Tecsmart.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract and inspect both Hotspot archives
        run: python3 tools/analyze_hotspot_archives.py

      - name: Upload extracted files and analysis
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-source-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 30
