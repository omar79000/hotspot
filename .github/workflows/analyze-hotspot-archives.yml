name: Analyze Hotspot Archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-hotspot-archives.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotspot-archive-analysis
  cancel-in-progress: false

jobs:
  extract-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract archives safely and create inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess, shutil, hashlib, os

          root = Path.cwd()
          out = root / "analysis" / "extracted"
          out.mkdir(parents=True, exist_ok=True)
          report = ["# Hotspot Pages — Extraction Inventory", "",
                    "Generated by GitHub Actions. Original archives are unchanged.", ""]

          def safe_extract_zip(zf, dest):
              base = dest.resolve()
              for info in zf.infolist():
                  target = (dest / info.filename).resolve()
                  if target != base and base not in target.parents:
                      raise RuntimeError(f"Unsafe archive path: {info.filename}")
              zf.extractall(dest)

          archives = [
              ("AL-TAJ.NET.rar.zip", "AL-TAJ.NET"),
              ("Tecsmart.zip", "Tecsmart"),
          ]
          for archive_name, folder_name in archives:
              src = root / archive_name
              dest = out / folder_name
              if not src.is_file():
                  raise SystemExit(f"Missing archive: {archive_name}")
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir(parents=True)
              digest = hashlib.sha256(src.read_bytes()).hexdigest()
              report += [f"## {folder_name}", "",
                         f"- Source: `{archive_name}`",
                         f"- Archive size: {src.stat().st_size} bytes",
                         f"- SHA-256: `{digest}`", ""]
              if not zipfile.is_zipfile(src):
                  raise SystemExit(f"{archive_name} is not a valid ZIP archive")
              with zipfile.ZipFile(src) as zf:
                  safe_extract_zip(zf, dest)
              # The AL-TAJ archive may be a ZIP containing a RAR file.
              rar_files = list(dest.rglob("*.rar")) + list(dest.rglob("*.RAR"))
              for rar in rar_files:
                  target = rar.parent / (rar.stem + "_contents")
                  target.mkdir(exist_ok=True)
                  subprocess.run(["7z", "x", "-y", f"-o{target}", str(rar)],
                                 check=True, capture_output=True, text=True)
              files = sorted(p for p in dest.rglob("*") if p.is_file())
              report += [f"### Files ({len(files)})", ""]
              for p in files:
                  rel = p.relative_to(dest).as_posix()
                  report.append(f"- `{rel}` — {p.stat().st_size} bytes")
              report.append("")
          (root / "analysis" / "HOTSPOT_ANALYSIS_INVENTORY.md").write_text(
              "\n".join(report) + "\n", encoding="utf-8")
          PY

      - name: Commit extracted copies and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/
          if git diff --cached --quiet; then
            echo "No extracted output changes."
          else
            git commit -m "Add extracted hotspot archives for source analysis"
            git push
          fi
